# netlify.toml — BIN SALEH Store (frontend static hosting only)
# The backend API runs on Render (see binsaleh-frontend/js/api.js API_BASE).
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "binsaleh-frontend"  # All static HTML/CSS/JS files are here

# SPA fallback — serve index.html for unknown client-side routes (optional)
# [[redirects]]
#   from = "/*"
#   to = "/index.html"
#   status = 200
